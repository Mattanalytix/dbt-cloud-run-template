
steps:
- id: 'image name'
  name: 'alpine'
  entrypoint: 'sh'  
  args: 
  - '-c'
  - | 
      echo "***********************"
      echo "$_IMAGE"
      echo "***********************"

- id: 'branch name'
  name: 'alpine'
  entrypoint: 'sh'  
  args: 
  - '-c'
  - | 
      echo "***********************"
      echo "$BRANCH_NAME"
      echo "***********************"

- id: 'tf fmt'
  name: 'hashicorp/terraform:${_TF_VERSION}'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
        terraform fmt -recursive -check

- id: 'tf init'
  name: 'hashicorp/terraform:${_TF_VERSION}'
  entrypoint: 'sh'
  args: 
  - '-c'
  - |
      cd ${_ENV_PATH}
      terraform init

options:
  logging: CLOUD_LOGGING_ONLY